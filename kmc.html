<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kuda Mewa Construction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Kuda Mewa Construction</h1>
  </header>

  <!-- Dashboard -->
  <div class="container">

    <div class="card" onclick="goToProjects()">
      <h2>📋 Projects</h2>
      <p>Manage all construction projects</p>
    </div>

    <div class="card" onclick="goToWorkers()">
      <h2>👷 Workers</h2>
      <p>Track workers & assignments</p>
    </div>

    <div class="card" onclick="goToCost()">
      <h2>💰 Cost Estimator</h2>
      <p>Calculate building costs</p>
    </div>

    <div class="card" onclick="goToPhotos()">
      <h2>📸 Site Photos</h2>
      <p>Upload & view progress</p>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
